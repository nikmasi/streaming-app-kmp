eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery:8761/eureka/

server:
  port: 8222

spring:
  application:
    name: gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        - id: auth
          uri: lb://auth
          predicates:
            - Path=/api/v1/auth/**

        - id: user
          uri: lb://auth
          predicates:
            - Path=/api/v1/user/**

        - id: catalog
          uri: lb://catalog
          predicates:
            - Path=/api/v1/catalog/**

        - id: favourites
          uri: lb://favourites
          predicates:
            - Path=/api/v1/favourites/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:8080"
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000
      refresh-token:
        expiration: 604800000

management:
  tracing:
    sampling:
      probability: 1.0