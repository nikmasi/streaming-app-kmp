eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery:8761/eureka/

server:
  port: 8050

spring:
  application:
    name: favourites

  data:
    mongodb:
      uri: mongodb://mongodb:27017/favourites_db
      database: favourites_db

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans