eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery:8761/eureka/

server:
  port: 8090

spring:
  application:
    name: catalog

  data:
    mongodb:
      uri: mongodb://mongodb:27017/catalog_db
      database: catalog_db

  logging:
    level:
      org.springframework.data.mongodb.core.MongoTemplate: DEBUG

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans