eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery:8761/eureka/

server:
  port: 8080

spring:
  application:
    name: playback

  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

  data:
    mongodb:
      uri: mongodb://mongodb:27017/catalog_db
      database: catalog_db

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans