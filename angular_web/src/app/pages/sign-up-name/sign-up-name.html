<div class="landing-page">
  <header class="header">
    <h1 class="logo">NETFLIX</h1>

    <button class="sign-in" (click)="sign_in()"> {{ 'HEADER.SIGN_IN' | translate }} </button>
  </header>

  <div class="overlay"></div>

  <div class="content">
    <div class="password-card">
      <span class="step"> {{ 'SIGN_UP.STEP' | translate }} </span>

      <h1> {{ 'SIGN_UP.SUBTITLE' | translate }}</h1>
      <p>{{ 'SIGN_UP.DESCRIPTION' | translate }}</p>

      <p class="email"> {{ email }} </p>

      <input type="firstname" placeholder="{{ 'SIGN_UP.FIRSTNAME' | translate }}" [(ngModel)]="firstname">
      <input type="lastname" placeholder="{{ 'SIGN_UP.LASTNAME' | translate }}" [(ngModel)]="lastname">

      <button class="next-btn" (click)="sign_up()"> {{ 'SIGN_UP.NEXT' | translate }} </button>

    </div>
  </div>
</div>
