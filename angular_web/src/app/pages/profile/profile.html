<div class="profile-page">
  <!-- Navigacioni meni -->
  <header class="navbar" [ngClass]="{'scrolled': isScrolled}">
    <div class="nav-left">
      <div class="logo">NETFLIX</div>
      <nav class="nav-links">
        <a routerLink="/home" routerLinkActive="active">{{ 'NAV_MENU.HOME' | translate }}</a>
        <a href="#">{{ 'NAV_MENU.TV_SHOWS' | translate }}</a>
        <a href="#">{{ 'NAV_MENU.MOVIES' | translate }}</a>
        <a href="my-list">{{ 'NAV_MENU.MY_List' | translate }}</a>
      </nav>
    </div>
    <div class="nav-right">
    </div>
  </header>

  <div class="profile-card">
    <div class="profile-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Profil" class="avatar">
      <div>

        <h1>{{user.firstname}} {{user.lastname}}</h1>
        <p>{{user.email}}</p>
        <span class="role">{{user.role}}</span>
      </div>

    </div>
    <hr>

    <div class="profile-info">

      <div class="info">
        <label>{{ 'PROFILE.FIRSTNAME' | translate }}</label>
        <p>{{user.firstname}}</p>
      </div>
      <div class="info">
        <label>{{ 'PROFILE.LASTNAME' | translate }}</label>
        <p>{{user.lastname}}</p>
      </div>

      <div class="info">
        <label>{{ 'PROFILE.EMAIL' | translate }}</label>
        <p>{{user.email}}</p>
      </div>

      <div class="info">
        <label>{{ 'PROFILE.ROLE' | translate }}</label>
        <p>{{user.role}}</p>
      </div>
    </div>

    <div class="buttons">
      <button class="edit" (click)="edit_profile()">
        {{ 'PROFILE.EDIT' | translate }}
      </button>
      <button class="password">
        {{ 'PROFILE.CHANGE_PASSWORD' | translate }}
      </button>
      <button class="logout" (click)="logout()">
        {{ 'PROFILE.LOGOUT' | translate }}
      </button>
      <button class="edit" (click)="watch_history()">
        {{ 'PROFILE.WATCH_HISTORY' | translate }}
      </button>
    </div>
  </div>
</div>
