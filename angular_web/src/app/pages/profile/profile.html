<div class="profile-page">
  <!-- Navigacioni meni -->
  <header class="navbar" [ngClass]="{'scrolled': isScrolled}">
    <div class="nav-left">
      <div class="logo">NETFLIX</div>
      <nav class="nav-links">
        <a routerLink="/home" routerLinkActive="active">Home</a>
        <a href="#">TV Shows</a>
        <a href="#">Movies</a>
        <a href="my-list">My List</a>
      </nav>
    </div>
    <div class="nav-right">
    </div>
  </header>

  <div class="profile-card">
    <div class="profile-header">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="Profil" class="avatar">
      <div>

        <h1>{{user.firstname}} {{user.lastname}}</h1>
        <p>{{user.email}}</p>
        <span class="role">{{user.role}}</span>
      </div>

    </div>
    <hr>

    <div class="profile-info">

      <div class="info">
        <label>First Name</label>
        <p>{{user.firstname}}</p>
      </div>
      <div class="info">
        <label>Last Name</label>
        <p>{{user.lastname}}</p>
      </div>

      <div class="info">
        <label>Email</label>
        <p>{{user.email}}</p>
      </div>

      <div class="info">
        <label>Role</label>
        <p>{{user.role}}</p>
      </div>
    </div>

    <div class="buttons">
      <button class="edit" (click)="edit_profile()">
        Edit Profile
      </button>
      <button class="password">
        Change Password
      </button>
      <button class="logout" (click)="logout()">
        Logout
      </button>
      <button class="edit" (click)="watch_history()">
        Watch History
      </button>
    </div>
  </div>
</div>
