<div class="edit-page">
  <div class="edit-card">

    <h1>{{ 'PROFILE.EDIT' | translate }}</h1>

    <div class="avatar-container">
      <img [src]=" 'https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png'" class="avatar">
    </div>

    <form (ngSubmit)="save()">
      <div class="field">
        <label>{{ 'PROFILE.FIRSTNAME' | translate }}</label>

        <input  type="text" [(ngModel)]="user.firstname" name="firstname">
      </div>

      <div class="field">
        <label>{{ 'PROFILE.LASTNAME' | translate }}</label>

        <input type="text" [(ngModel)]="user.lastname" name="lastname">
      </div>

      <div class="buttons">
        <button type="submit" class="save"> {{ 'PROFILE.SAVE_CHANGES' | translate }} </button>

        <button type="button" routerLink="/profile" class="cancel">
          {{ 'PROFILE.CANCEL' | translate }} 
        </button>
      </div>
    </form>
  </div>
</div>
