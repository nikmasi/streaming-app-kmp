<div class="signin-page">

    <header class="header">
        <div class="logo">NETFLIX</div>
    </header>

    <div class="overlay"></div>

    <div class="signin-box">

        <h1>Sign In</h1>

        <form>

            <input
                type="email"
                placeholder="Email or mobile number">

            <input
                type="password"
                placeholder="Password">

            <button type="submit">
                Sign In
            </button>

        </form>

        <div class="options">

            <label>
                <input type="checkbox">
                Remember me
            </label>

            <a href="#">Need help?</a>

        </div>

        <div class="signup">

            New to Netflix?

            <a href="#">
                Sign up now.
            </a>

        </div>
    </div>
</div>
