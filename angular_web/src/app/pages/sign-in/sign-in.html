<div class="signin-page">

    <header class="header">
        <div class="logo">NETFLIX</div>
    </header>

    <div class="overlay"></div>
    <div class="signin-box">
        <h1>{{ 'HEADER.SIGN_IN' | translate }}</h1>
        <form>
            <input type="email" placeholder="{{ 'HOME.EMAIL' | translate }}"  name="email" [(ngModel)]="email">

            <input type="password" placeholder="{{ 'HOME.PASSWORD' | translate }}" name="password" [(ngModel)]="password">

            <button type="submit" (click)="signIn()"> {{ 'HEADER.SIGN_IN' | translate }} </button>
        </form>

        <div class="options">
            <a href="#">{{ 'HOME.HELP' | translate }}</a>
        </div>

        <div class="signup">
            {{ 'HOME.NEW' | translate }}
            <a href="#"> {{ 'HOME.SIGN_UP' | translate }} </a>
        </div>

        <p>{{error}}</p>
    </div>
</div>
