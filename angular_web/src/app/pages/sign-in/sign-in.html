<div class="signin-page">

    <header class="header">
        <div class="logo">NETFLIX</div>
    </header>

    <div class="overlay"></div>
    <div class="signin-box">
        <h1>Sign In</h1>
        <form>
            <input type="email" placeholder="Email"  name="email" [(ngModel)]="email">

            <input type="password" placeholder="Password" name="password" [(ngModel)]="password">

            <button type="submit" (click)="signIn()"> Sign In </button>
        </form>

        <div class="options">
            <a href="#">Need help?</a>
        </div>

        <div class="signup">
            New to Netflix?
            <a href="#"> Sign up now. </a>
        </div>

        <p>{{error}}</p>

    </div>
</div>
