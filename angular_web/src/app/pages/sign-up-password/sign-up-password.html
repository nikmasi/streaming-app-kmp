<div class="landing-page">
  <header class="header">
    <h1 class="logo">NETFLIX</h1>

    <button class="sign-in" (click)="sign_in()"> {{ 'HEADER.SIGN_IN' | translate }}</button>
  </header>

  <div class="overlay"></div>

  <div class="content">

    <div class="password-card">
      <span class="step"> {{ 'SIGN_UP.STEP2' | translate }} </span>

      <h1>{{ 'SIGN_UP.SUBTITLE2' | translate }}</h1>
      <p>{{ 'SIGN_UP.DESCRIPTION' | translate }}</p>

      <p class="email">{{ email }}</p>
      <p class="firstname">{{ firstname }} {{ lastname }}</p>

      <input type="password" placeholder="{{ 'SIGN_UP.PASSWORD' | translate }}" [(ngModel)]="password">

      <button class="next-btn" (click)="sign_up()"> {{ 'SIGN_UP.CREATE' | translate }} </button>
    </div>
  </div>
</div>
