<div class="landing-page">
  <header class="header">
    <h1 class="logo">NETFLIX</h1>

    <button class="sign-in" (click)="sign_in()">
      Sign In
    </button>
  </header>

  <div class="overlay"></div>

  <div class="content">

    <div class="password-card">

      <span class="step">
        STEP 2 OF 2
      </span>

      <h1>Create a password to start your membership</h1>

      <p>
        Just a few more steps and you're done! We hate paperwork, too.
      </p>

      <p class="email">{{ email }}</p>
      <p class="firstname">{{ firstname }} {{ lastname }}</p>

      <input
        type="password"
        placeholder="Add a password"
        [(ngModel)]="password">

      <button class="next-btn" (click)="sign_up()">
        Create
      </button>

    </div>

  </div>
</div>
