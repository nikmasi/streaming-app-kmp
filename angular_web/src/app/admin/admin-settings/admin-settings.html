<div class="admin-layout">
  <aside class="sidebar">
    <h2>Admin</h2>

    <ul>
      <li routerLink="/admin-panel" routerLinkActive="active">Dashboard</li>
      <li routerLink="/admin-movies" routerLinkActive="active">Movies</li>
      <li routerLink="/admin-tvshows" routerLinkActive="active">TV Shows</li>
      <li routerLink="/admin-users" routerLinkActive="active">Users</li>
      <li routerLink="/admin-categories" routerLinkActive="active" >Categories</li>
      <li routerLink="/admin-analytics" routerLinkActive="active">Analytics</li>
      <li routerLink="/admin-settings" routerLinkActive="active" class="active">Settings</li>
    </ul>
  </aside>

  <main class="content">
    <h1>Admin Settings</h1>
    
    <p class="subtitle">Manage application settings</p>

    <div class="settings-card">

      <h2>General</h2>

      <div class="form-group">
        <label>Site name</label>
        <input type="text" [(ngModel)]="siteName" placeholder="Streaming App"/>
      </div>

      <div class="form-group">
        <label>Default movie language</label>
        <select [(ngModel)]="defaultMovieLanguage">
          <option value="English">English</option>
          <option value="Serbian">Serbian</option>
        </select>
      </div>

    </div>

    <div class="settings-card">
      <h2>Users</h2>

      <div class="setting-row">
        <div>
          <strong>Allow registration</strong>
          <p>Allow new users to create accounts.</p>
        </div>
        <input type="checkbox" [(ngModel)]="allowRegistration"/>
      </div>
    </div>

    <div class="settings-card">

      <h2>System</h2>

      <div class="setting-row">
        <div>
          <strong>Maintenance mode</strong>
          <p>Temporarily disable access for normal users.</p>
        </div>

        <input type="checkbox" [(ngModel)]="maintenanceMode"/>
      </div>

      <div class="form-group">
        <label>Maximum upload size (MB)</label>
        <input type="number" [(ngModel)]="maxUploadSize" min="1"/>
      </div>

    </div>

    <button class="save-button" (click)="saveSettings()">Save Settings</button>

  </main>
</div>
