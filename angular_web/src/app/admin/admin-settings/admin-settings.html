<div class="admin-layout">
  <aside class="sidebar">
    <h2>Admin</h2>

    <ul>
      <li routerLink="/admin-panel" routerLinkActive="active">Dashboard</li>
      <li routerLink="/admin-movies" routerLinkActive="active">Movies</li>
      <li routerLink="/admin-tvshows" routerLinkActive="active">TV Shows</li>
      <li routerLink="/admin-users" routerLinkActive="active">Users</li>
      <li routerLink="/admin-categories" routerLinkActive="active" >Categories</li>
      <li routerLink="/admin-analytics" routerLinkActive="active">Analytics</li>
      <li routerLink="/admin-settings" routerLinkActive="active" class="active">Settings</li>
    </ul>
  </aside>

  <main class="content">

    <h1>Admin Settings</h1>

    <div class="settings-card">

    <h2>General Settings</h2>

    <div class="form-group">
    <label>Application Name</label>
    <input value="Streaming App">
    </div>


    <div class="form-group">
    <label>Maintenance Mode</label>

    <select>
    <option>Disabled</option>
    <option>Enabled</option>
    </select>

    </div>


    <button>
    Save Changes
    </button>

    </div>

  </main>
</div>
