<div class="admin-layout">
  <aside class="sidebar">
    <h2>Admin</h2>

    <ul>
      <li routerLink="/admin-panel" routerLinkActive="active">Dashboard</li>
      <li routerLink="/admin-movies" routerLinkActive="active">Movies</li>
      <li routerLink="/admin-tvshows" routerLinkActive="active">TV Shows</li>
      <li routerLink="/admin-users" routerLinkActive="active">Users</li>
      <li routerLink="/admin-categories" routerLinkActive="active" class="active">Categories</li>
      <li routerLink="/admin-analytics" routerLinkActive="active">Analytics</li>
      <li routerLink="/admin-settings" routerLinkActive="active">Settings</li>
    </ul>
  </aside>

  <main class="content">

    <h1>Admin Categories</h1>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let category of categories">
                <td>{{ category.name }} </td>
                <td> {{ category.movieCount }} movies</td>
            </tr>
        </tbody>
    </table>

  </main>
</div>
